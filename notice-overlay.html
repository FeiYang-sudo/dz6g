<!-- ═══════════ 强提示浮层（可关闭） ═══════════
     关闭后本次会话不再出现；下次打开会再提示。
     想彻底停用：把下面 <script> 里的 ENABLED 改成 false。
     想换文案：改 .dz6g-notice 里的文字即可。 -->
<div id="dz6gNotice" role="dialog" aria-modal="true" aria-labelledby="dz6gNoticeTitle">
  <div class="dz6g-notice">
    <div class="dz6g-rule"></div>
    <p class="dz6g-kicker">Site Notice</p>
    <h2 id="dz6gNoticeTitle">主站及论坛即将下架</h2>
    <p class="dz6g-sub">邓州市第六高级中学 · 站内通知</p>

    <p class="dz6g-body">
      因内容调整，<span>主站与论坛</span>将在近期停止对外服务，届时将无法访问。<br>
      <b style="color:#c9a96e">GitHub 镜像站仍会保留</b>，内容可以继续在那里查看。
    </p>

    <div class="dz6g-meta">
      <div><b>下架时间</b>2026 年 11 月 8 日起</div>
      <div><b>影响范围</b>主站 dz6g.ccwu.cc + 论坛 /board</div>
      <div><b>镜像站</b><a href="https://feiyang-sudo.github.io/dz6g/" target="_blank" rel="noopener">feiyang-sudo.github.io/dz6g</a>（保留）</div>
    </div>

    <p class="dz6g-contact">有需要联系：<a href="mailto:3624230684@qq.com">3624230684@qq.com</a></p>

    <button id="dz6gNoticeClose" type="button">我知道了，继续访问</button>
    <p class="dz6g-hint">（每次进入都会提示，可随时关闭）</p>
  </div>
</div>

<style>
  #dz6gNotice{
    position:fixed;inset:0;z-index:99999;
    display:flex;align-items:center;justify-content:center;padding:22px;
    background:rgba(4,4,4,.80);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    opacity:0;transition:opacity .38s ease;
  }
  #dz6gNotice.on{opacity:1;}
  #dz6gNotice.off{opacity:0;pointer-events:none;}
  .dz6g-notice{
    position:relative;width:100%;max-width:490px;
    background:linear-gradient(165deg,#131313 0%,#0b0b0b 100%);
    border:1px solid rgba(201,169,110,.22);
    border-radius:16px;
    padding:34px 32px 26px;
    box-shadow:0 28px 80px rgba(0,0,0,.82),0 0 0 1px rgba(201,169,110,.06),inset 0 1px 0 rgba(255,255,255,.05);
    max-height:calc(100vh - 32px);
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    transform:translateY(14px) scale(.985);
    transition:transform .42s cubic-bezier(.22,1,.36,1);
    text-align:left;
  }
  #dz6gNotice.on .dz6g-notice{transform:translateY(0) scale(1);}
  .dz6g-rule{width:40px;height:2px;background:linear-gradient(90deg,#c9a96e,transparent);margin-bottom:20px;}
  .dz6g-kicker{font-size:11px;letter-spacing:.28em;color:#8d7548;margin:0 0 10px;text-transform:uppercase;}
  .dz6g-notice h2{
    font-size:clamp(25px,6vw,33px);font-weight:700;letter-spacing:.03em;line-height:1.3;
    margin:0 0 7px;
    background:linear-gradient(180deg,#fff 0%,#c9a96e 140%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .dz6g-sub{font-size:13px;color:#9d9a92;letter-spacing:.05em;margin:0 0 22px;}
  .dz6g-body{font-size:15px;line-height:1.9;color:#e8e6e1;opacity:.92;margin:0 0 20px;}
  .dz6g-body span{color:#c9a96e;}
  .dz6g-meta{border-left:2px solid rgba(141,117,72,.8);padding-left:14px;margin-bottom:20px;}
  .dz6g-meta div{font-size:13px;line-height:2;color:#9d9a92;}
  .dz6g-meta b{color:#e8e6e1;font-weight:500;display:inline-block;min-width:72px;opacity:.85;}
  .dz6g-contact{font-size:13px;color:#9d9a92;margin:0 0 24px;}
  .dz6g-contact a{word-break:break-all;color:#c9a96e;text-decoration:none;border-bottom:1px solid rgba(201,169,110,.35);}
  #dz6gNoticeClose{
    display:block;width:100%;padding:13px 16px;cursor:pointer;
    background:linear-gradient(180deg,#d4b57c,#c9a96e);color:#141210;
    border:0;border-radius:10px;font-size:15px;font-weight:600;letter-spacing:.04em;
    font-family:inherit;transition:filter .2s,transform .1s;
  }
  #dz6gNoticeClose:hover{filter:brightness(1.06);}
  #dz6gNoticeClose:active{transform:scale(.985);}
  .dz6g-meta a{color:#c9a96e;text-decoration:none;border-bottom:1px solid rgba(201,169,110,.35);word-break:break-all;}
  .dz6g-hint{font-size:13px;color:#8d8a82;text-align:center;margin:11px 0 0;letter-spacing:.04em;}
  @media(max-width:420px){
    .dz6g-notice{padding:26px 22px 20px;border-radius:14px;}
    .dz6g-body{font-size:14px;}
  }
</style>

<script>
(function () {
  var ENABLED = true;                  // ← 想彻底停用改成 false
  if (!ENABLED) return;

  var el = document.getElementById('dz6gNotice');
  var btn = document.getElementById('dz6gNoticeClose');
  if (!el || !btn) return;


  var prevOverflow = document.body.style.overflow;
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(function () { el.classList.add('on'); });

  function close() {
    el.classList.remove('on');
    el.classList.add('off');
    document.body.style.overflow = prevOverflow;
    setTimeout(function () { el.parentNode && el.parentNode.removeChild(el); }, 420);
  }

  btn.addEventListener('click', close);
  el.addEventListener('click', function (e) { if (e.target === el) close(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });

  // 焦点给按钮，键盘/无障碍更友好
  setTimeout(function () { try { btn.focus(); } catch (e) {} }, 260);
})();
</script>
