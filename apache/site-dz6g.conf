<VirtualHost *:80>
	# The ServerName directive sets the request scheme, hostname and port that
	# the server uses to identify itself. This is used when creating
	# redirection URLs. In the context of virtual hosts, the ServerName
	# specifies what hostname must appear in the request's Host: header to
	# match this virtual host. For the default virtual host (this file) this
	# value is not decisive as it is used as a last resort host regardless.
	# However, you must set it for any further virtual host explicitly.
	#ServerName www.example.com

	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/dz6g

	# Flarum forum at /board
	Alias /board /var/www/flarum/public
	<Directory /var/www/flarum/public>
		Options -Indexes
		AllowOverride All
		Require all granted
	</Directory>

	# SnappyMail webmail at /mail
	Alias /mail /var/www/snappymail
	<Directory /var/www/snappymail>
		Options -Indexes
		AllowOverride All
		AuthType Basic
		AuthName "Webmail Login"
		AuthUserFile /etc/apache2/.htpasswd-dsh
		Require valid-user
	</Directory>

	# 私人日记（静态生成的只读副本，带独立密码）
	# 源文件锁在 /root/diary/entries/，www-data 读不到；这里只发布生成好的网页
	Alias /diary /var/www/diary
	<Directory /var/www/diary>
		Options -Indexes
		AllowOverride None
		AuthType Basic
		AuthName "Diary"
		AuthUserFile /etc/apache2/.htpasswd-diary
		Require valid-user
	</Directory>

	# The SPA's logout handler hard-codes window.location.assign('/login')
	# (no /hermes prefix). Redirect the root /login back to the proxied
	# login page so logout lands correctly. School site has no /login path.
	RedirectMatch 302 ^/login$ /hermes/login

	# Lazy-loaded SPA chunks (chat/sessions/xterm routes) are requested
	# at the Vite build-time absolute base /assets/... (no /hermes prefix),
	# so proxy the root /assets path to the dashboard too. Only static
	# files live here; the school site has no /assets dir, so no conflict.
	<Location /assets/>
		ProxyPass http://127.0.0.1:9119/assets/
		ProxyPassReverse http://127.0.0.1:9119/assets/
		Require all granted
	</Location>

	# Hermes Agent web dashboard (chat + admin) at /hermes
	# Strip the /hermes prefix -> dashboard serves API/WS at root;
	# X-Forwarded-Prefix makes it rewrite asset URLs in the HTML.
	<Location /hermes/>
		ProxyPass http://127.0.0.1:9119/
		ProxyPassReverse http://127.0.0.1:9119/
		Require all granted
	</Location>
	<Location /hermes/api/events>
		ProxyPass ws://127.0.0.1:9119/api/events
		ProxyPassReverse ws://127.0.0.1:9119/api/events
		Require all granted
	</Location>
	<Location /hermes/api/ws>
		ProxyPass ws://127.0.0.1:9119/api/ws
		ProxyPassReverse ws://127.0.0.1:9119/api/ws
		Require all granted
	</Location>
	<Location /hermes/api/pty>
		ProxyPass ws://127.0.0.1:9119/api/pty
		ProxyPassReverse ws://127.0.0.1:9119/api/pty
		Require all granted
	</Location>
	<Location /hermes/api/console>
		ProxyPass ws://127.0.0.1:9119/api/console
		ProxyPassReverse ws://127.0.0.1:9119/api/console
		Require all granted
	</Location>
	<Location /hermes/api/audio/speak-stream>
		ProxyPass ws://127.0.0.1:9119/api/audio/speak-stream
		ProxyPassReverse ws://127.0.0.1:9119/api/audio/speak-stream
		Require all granted
	</Location>
	ProxyRequests Off
	# ProxyPreserveHost Off: dashboard Host-header check requires 127.0.0.1
	ProxyPreserveHost Off
	RequestHeader set X-Forwarded-Proto "https"
	RequestHeader set X-Forwarded-Host "dz6g.ccwu.cc"
	RequestHeader set X-Forwarded-Prefix "/hermes"

	# Available loglevels: trace8, ..., trace1, debug, info, notice, warn,
	# error, crit, alert, emerg.
	# It is also possible to configure the loglevel for particular
	# modules, e.g.
	#LogLevel info ssl:warn

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	# For most configuration files from conf-available/, which are
	# enabled or disabled at a global level, it is possible to
	# include a line for only one particular virtual host. For example the
	# following line enables the CGI configuration for this host only
	# after it has been globally disabled with "a2disconf".
	#Include conf-available/serve-cgi-bin.conf
</VirtualHost>
